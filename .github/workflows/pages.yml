name: Publish to gh-pages

# main에 올라온 내용을 gh-pages 브랜치로 복사합니다. GitHub Pages는 gh-pages 브랜치를 배포합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
