<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이디어톤 주제 뽑기</title>
  <meta name="description" content="2026 DT 학술제 통합 아이디어톤 장르·키워드 뽑기">
  <link rel="stylesheet" href="fonts/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="lines" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
    <g class="drift-a">
      <line x1="-1600" y1="-900" x2="3200" y2="1800"/>
      <line x1="3200" y1="-900" x2="-1600" y2="1800"/>
    </g>
    <g class="drift-b">
      <line x1="0" y1="-450" x2="2400" y2="900"/>
      <line x1="1600" y1="-450" x2="-800" y2="900"/>
      <line x1="-800" y1="0" x2="1600" y2="1350"/>
      <line x1="2400" y1="0" x2="0" y2="1350"/>
    </g>
  </svg>
  <header class="bar">
    <span>통합 아이디어톤 · 주제 뽑기</span>
    <span>2026 DT CONFERENCE</span>
  </header>

  <main class="stage">
    <section class="intro" id="intro">
      <h1>Ideathon<br>Random Draw</h1>
      <p class="sub">2026 DT 학술제</p>
    </section>

    <section class="deck" id="deck" hidden aria-live="polite">
      <article class="card" data-cat="genre">
        <div class="inner">
          <div class="face back"><span class="num">01</span><span class="x" aria-hidden="true"></span></div>
          <div class="face front">
            <div class="meta"><span>01</span><span>GENRE</span></div>
            <p class="label">장르</p>
            <p class="value"></p>
          </div>
        </div>
      </article>
      <article class="card" data-cat="keyword">
        <div class="inner">
          <div class="face back"><span class="num">02</span><span class="x" aria-hidden="true"></span></div>
          <div class="face front">
            <div class="meta"><span>02</span><span>KEYWORD</span></div>
            <p class="label">키워드</p>
            <p class="value"></p>
          </div>
        </div>
      </article>
    </section>

    <button class="draw" id="draw" type="button">DRAW</button>
  </main>

  <footer class="band" aria-hidden="true"></footer>

  <div class="team-dock">
    <div class="team-panel" id="teamPanel" aria-hidden="true">
      <span class="team-hint" id="teamHint"></span>
    </div>
    <button class="team-btn" id="teamBtn" type="button" aria-expanded="false" aria-controls="teamPanel"></button>
  </div>

  <dialog class="list" id="results" aria-labelledby="resultsTitle">
    <div class="list-head">
      <h2 id="resultsTitle">조별 결과</h2>
      <button class="list-close" id="resultsClose" type="button" aria-label="닫기">×</button>
    </div>
    <div class="list-body results-body">
      <table class="results-table">
        <thead><tr><th>조</th><th>장르</th><th>키워드</th></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <button class="results-reset" id="resultsReset" type="button">기록 초기화</button>
    </div>
  </dialog>

  <button class="list-btn" id="listBtn" type="button" aria-label="전체 목록 보기" aria-haspopup="dialog"></button>

  <dialog class="list" id="list" aria-labelledby="listTitle">
    <div class="list-head">
      <h2 id="listTitle">전체 목록</h2>
      <button class="list-close" id="listClose" type="button" aria-label="닫기">×</button>
    </div>
    <div class="list-body">
      <section><h3><span>GENRE</span>장르</h3><ol id="list-genre"></ol></section>
      <section><h3><span>KEYWORD</span>키워드</h3><ol id="list-keyword"></ol></section>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
